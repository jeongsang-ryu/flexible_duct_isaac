<!doctype html><meta charset="utf-8"><title>chain test</title>
<script src="duct_chain.js"></script>
<pre id="out">running…</pre>
<script>
const L=[];
const D=window.DuctChain;
const R_DUCT=0.20;                    // 0.4 m duct
function check(name, cond, detail){ L.push((cond?"PASS  ":"FAIL  ")+name+(detail?"   "+detail:"")); }

// 1. length is conserved while dragging
{
  const d=D.makeDuct(6,0.5,0,0);
  const L0=D.chainLength(d);
  d.pts[0][0]=5; d.pts[0][1]=4;                 // yank the head far away
  D.relax(d, [], R_DUCT, 0);
  let sum=0; for(let i=1;i<d.pts.length;i++) sum+=Math.hypot(d.pts[i][0]-d.pts[i-1][0], d.pts[i][1]-d.pts[i-1][1]);
  check("length conserved under a hard drag", Math.abs(sum-L0)<0.02, `want ${L0.toFixed(3)} got ${sum.toFixed(3)}`);
}

// 2. a post SMALLER than the node spacing cannot be passed through
{
  const d=D.makeDuct(6,0.5,0,-1.5);
  const post={x:0,y:0,r:0.25};
  // drag the head straight across the post to the far side
  for(let s=1;s<=40;s++){
    d.pts[0][0]=0; d.pts[0][1]=-1.5+ (3.0*s/40);
    D.relax(d,[post],R_DUCT,0);
  }
  const md=D.minPostDistance(d.pts, post);
  check("duct stays clear of a post it is dragged across", md >= post.r+R_DUCT-0.01,
        `clearance needed ${(post.r+R_DUCT).toFixed(3)} got ${md.toFixed(3)}`);
}

// 3. moving the post pushes the duct aside
{
  const d=D.makeDuct(8,0.5,0,0);
  const post={x:-4,y:0,r:0.3};
  for(let s=0;s<=40;s++){
    post.x=-4+8*s/40;
    D.relax(d,[post],R_DUCT,-1);
  }
  const md=D.minPostDistance(d.pts, post);
  check("duct gives way to a post driven through it", md >= post.r+R_DUCT-0.01,
        `clearance needed ${(post.r+R_DUCT).toFixed(3)} got ${md.toFixed(3)}`);
}

// 4. several posts at once, and length still holds
{
  const d=D.makeDuct(10,0.5,0,-2);
  const posts=[{x:-2,y:0,r:0.3},{x:0,y:0.4,r:0.3},{x:2,y:0,r:0.3}];
  const L0=D.chainLength(d);
  for(let s=1;s<=50;s++){ d.pts[0][1]=-2+4*s/50; D.relax(d,posts,R_DUCT,0); }
  let ok=true, worst=99;
  posts.forEach(p=>{ const m=D.minPostDistance(d.pts,p); worst=Math.min(worst,m-(p.r+R_DUCT)); if(m<p.r+R_DUCT-0.02) ok=false; });
  let sum=0; for(let i=1;i<d.pts.length;i++) sum+=Math.hypot(d.pts[i][0]-d.pts[i-1][0], d.pts[i][1]-d.pts[i-1][1]);
  check("three posts cleared at once", ok, `worst margin ${worst.toFixed(3)} m`);
  check("length still conserved with posts", Math.abs(sum-L0)<0.05, `want ${L0.toFixed(3)} got ${sum.toFixed(3)}`);
}
document.getElementById("out").textContent=L.join("\n");
</script>
